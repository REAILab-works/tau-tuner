<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>τ 调音师</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
/* Layout idea: one strip-chart recorder (the kind that draws well logs) fills the page;
   the player holds the red pen. Single visual world: chart paper, navy ink, red pen. */
:root{
  color-scheme: light;
  --paper:#edf3e8; --grid:#bcd5c1; --ink:#1c2947; --pen:#d3382c; --brass:#a9781f;
  --panel:#fbfcf7; --muted:#56655f; --line:#c9d6c9;
  --display:"ZCOOL QingKe HuangYou","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-position:-1px -1px}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,8vw,64px);line-height:1;margin:0;letter-spacing:.02em}
h1 span{color:var(--pen)}
.sub{margin:12px 0 0;color:var(--muted);font-size:14px;max-width:36em}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav{display:flex;gap:6px}
nav button{font-family:var(--mono);font-size:13px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);
  width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
nav button small{font-size:9px;color:var(--brass);letter-spacing:-1px}
nav button[aria-current="true"]{background:var(--ink);color:var(--panel)}
nav button:disabled{opacity:.35;cursor:not-allowed}
.pill{font-family:var(--body);font-size:13px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:22px;height:44px;padding:0 14px;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#fff}
.intro{display:grid;grid-template-columns:1.2fr .8fr;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;color:#f3efe4;
  background:linear-gradient(180deg,#2c3655 0,#1c2947 38%,#10182d 100%)}
.intro[hidden],#game[hidden],.ttl[hidden]{display:none}
#game{display:flex;flex-direction:column;gap:16px}
.intro .l{padding:40px 36px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.intro h2{font-family:var(--display);font-weight:400;font-size:clamp(52px,9vw,92px);line-height:1;margin:0;color:#fbfcf7}
.intro h2 span{color:#ff6a5c}
.intro p{margin:0;font-size:16.5px;max-width:30em;color:#d6dbe8}
.intro .mis{font-weight:700;color:#fbfcf7}
.intro .eye{color:#e2b866}
.intro .btn{align-self:flex-start;font-size:18px;padding:12px 30px;margin-top:8px}
.intro svg{display:block;width:100%;height:100%;min-height:380px}
.intro h2.sm{font-size:clamp(34px,6vw,56px);line-height:1.1;text-wrap:balance}
.intro .toy{padding:26px 28px;display:flex;flex-direction:column;gap:8px;justify-content:center;background:rgba(0,0,0,.18)}
.intro .toy svg{min-height:0;height:auto}
.intro .toy label{font-family:var(--mono);font-size:15px;color:#fbfcf7}
.intro .toy input{accent-color:#ff6a5c;width:100%;min-width:0;flex:none}
.intro .toy small{color:#aab3c8}
.card{background:var(--panel);border:1.5px solid var(--ink);border-radius:6px}
.mission{padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:center}
.mission h2,.debrief h2,.final h2{font-family:var(--display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
.mission h2{font-size:28px}
.mission p{margin:4px 0 0;font-size:15px;max-width:38em}
.read{text-align:right;min-width:150px}
.read .lab{font-size:12px;color:var(--muted);letter-spacing:.08em}
.read .num{font-family:var(--mono);font-weight:600;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--pen)}
.read .num.ok{color:var(--ink)}
.read .stars{font-size:22px;color:var(--brass);letter-spacing:2px;line-height:1.2}
.read .goal{font-size:12px;color:var(--muted)}
.quip{font-size:13px;font-weight:500}
.rec{padding:10px 10px 6px}
canvas{display:block;width:100%}
#tank{height:68px;margin-bottom:4px}
#chart{height:300px;border-radius:3px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:6px 4px 2px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.legend .sp{margin-left:auto}
.link{font:inherit;color:var(--ink);background:none;border:0;border-bottom:1.5px solid var(--ink);padding:0;cursor:pointer}
.controls{padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row label{font-size:14px;min-width:8.5em}
.row output{font-family:var(--mono);font-size:15px;min-width:4.5em;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--pen);flex:1;min-width:140px;height:32px;margin:0}
.row input[type=range],.toy input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:40px;touch-action:pan-y;cursor:pointer}
.row input[type=range]::-webkit-slider-runnable-track,.toy input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#c4d2c6}
.row input[type=range]::-webkit-slider-thumb,.toy input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--pen);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink);margin-top:-11px}
.row input[type=range]::-moz-range-track,.toy input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#c4d2c6}
.row input[type=range]::-moz-range-thumb,.toy input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--pen);border:3px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
.st{font-family:var(--mono);font-size:20px;font-weight:600;line-height:1;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;flex:none;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.st:active{background:var(--ink);color:var(--panel)}
.fader .st{width:36px;height:34px;border-radius:6px}
.touch .fader input{display:none}
input:focus-visible,button:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.faders{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px 0 36px}
.fader{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);font-size:12px}
.fader input{writing-mode:vertical-lr;direction:rtl;width:32px;height:110px;min-width:0;flex:none}
.fader b{font-weight:600;font-variant-numeric:tabular-nums}
.fader i{font-style:normal;color:var(--brass);min-height:1.3em}
.btn{font-family:var(--body);font-weight:700;font-size:15px;min-height:44px;padding:8px 18px;border-radius:4px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.go{background:var(--pen);border-color:var(--pen);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{font-family:var(--body);font-size:14px;font-weight:500;min-height:40px;padding:6px 14px;border:0;background:var(--panel);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted)}
.monoRow{font-family:var(--mono);font-size:14px}
.vs{font-family:var(--mono);font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;padding:10px 14px;border:1.5px dashed var(--ink);border-radius:4px}
.vs b{font-weight:600}.vs .m{color:var(--brass)}.vs .v{grid-column:1/-1;font-family:var(--body);font-weight:700;margin-top:4px}
.tag{font-size:13px;font-weight:700;color:#fff;background:var(--pen);border-radius:3px;padding:2px 8px;white-space:nowrap}
.debrief{padding:18px;border-color:var(--brass);border-width:2.5px}
.debrief[hidden],.final[hidden],.faders[hidden]{display:none}
.debrief h2{font-size:28px;color:var(--ink)}
.eye{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--brass);font-weight:600}
.pair{display:flex;align-items:stretch;gap:0;margin:12px 0 10px;flex-wrap:wrap}
.pair div{padding:8px 14px;border:1.5px solid var(--ink)}
.pair small{display:block;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.pair .g{font-family:var(--mono);font-weight:600;color:var(--pen);border-radius:4px 0 0 4px;background:#fff}
.pair .r{font-weight:700;background:var(--ink);color:var(--panel);border-radius:0 4px 4px 0}
.pair .r small{color:#b9c4d8}
.debrief p{margin:0 0 14px;max-width:40em;font-size:15px}
.dbody{display:grid;grid-template-columns:1fr minmax(220px,300px);gap:20px;align-items:center}
.dfig svg{display:block;width:100%;height:auto;border:1.5px solid var(--line);border-radius:4px;background:#fff;cursor:pointer}
.final{padding:0;overflow:hidden}
.final .intro.end{border:0;border-radius:0}
.final .intro .big{color:#e2b866}
.final .top{padding:18px}
.final .top p{margin:12px auto 0;text-align:center}
.final .top{text-align:center}
.final h2{font-size:40px}
.final h3{font-family:var(--display);font-weight:400;font-size:28px;margin:22px 0 4px}
.final .big{font-size:clamp(17px,4.9vw,34px);color:var(--brass);letter-spacing:0;white-space:nowrap}
.final p{max-width:40em;margin:8px 0;font-size:15px}
.final img{max-width:min(100%,340px);border:1.5px solid var(--ink);border-radius:6px;margin:14px auto 4px;display:block}
.final small{color:var(--muted)}
.final svg{display:block;width:100%;max-width:520px;height:auto;margin:10px 0}
.punch{font-weight:700;font-size:17px;border-left:4px solid var(--pen);padding-left:12px;margin:14px 0 !important}
.bars{display:grid;gap:6px;max-width:600px;margin:8px 0 4px}
.bars .b{display:grid;grid-template-columns:minmax(7.5em,11em) 1fr;gap:10px;align-items:center;font-size:13.5px}
.bars .t{height:24px;background:var(--pen);border-radius:0 3px 3px 0;position:relative;min-width:2px}
.bars .t span{position:absolute;left:100%;margin-left:8px;font-family:var(--mono);font-weight:600;line-height:24px;white-space:nowrap}
footer{font-size:12.5px;color:var(--muted);max-width:60em}
@media (max-width:600px){
  .intro{grid-template-columns:1fr}
  .intro .l{padding:26px 20px 10px}
  .intro p{font-size:15.5px}
  .intro .btn{align-self:stretch}
  .intro svg{min-height:0;height:auto}
  #game{gap:12px}
  .wrap{padding:14px 12px 32px;gap:12px}
  header{align-items:flex-start}
  .sub{font-size:13.5px}
  .tools{width:100%;justify-content:space-between}
  nav button{width:40px;height:40px}
  .pill{height:40px;padding:0 12px}
  .mission{grid-template-columns:1fr;padding:12px 14px}
  .mission h2{font-size:24px}
  .read{text-align:left;display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;border-top:1.5px solid var(--line);padding-top:8px}
  .read .lab{width:100%}
  .read .num{font-size:34px}
  .rec{padding:8px 6px 6px}
  #tank{height:58px}
  #chart{height:230px}
  .legend{font-size:12px}
  .legend .sp{margin-left:0;width:100%}
  .controls{padding:12px 14px}
  .row label{min-width:100%;margin-bottom:-8px}
  .row output{min-width:0;order:9;width:100%;text-align:left;margin-top:-8px}
  .faders{padding:0 4px 0 28px}
  .fader .st{width:100%;max-width:40px}
  .row .btn{flex:1 1 100%}
  .fader input{height:100px;width:36px}
  .fader{font-size:11px}
  .debrief{padding:14px}
  .debrief h2{font-size:23px}
  .pair div{flex:1 1 100%;border-radius:4px 4px 0 0 !important}
  .pair .r{border-radius:0 0 4px 4px !important}
  .debrief .btn,.final .btn{width:100%}
  .dbody{grid-template-columns:1fr;gap:10px}
  .dfig{order:-1;max-width:340px}
  .final .top{padding:14px}
  .final h2{font-size:34px}
  .bars .b{grid-template-columns:1fr;gap:2px}
  .bars .t{max-width:78%}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ttl" id="ttl">
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tools">
      <div style="display:flex;gap:8px"><button class="pill" id="lang"></button><button class="pill" id="snd" aria-pressed="false"></button></div>
      <nav id="nav" aria-label="levels"></nav>
    </div>
  </header>

  <section class="intro" id="intro" hidden></section>
  <div id="game">
  <section class="card mission">
    <div><h2 id="mTitle"></h2><p id="mText"></p></div>
    <div class="read" aria-live="polite">
      <div class="lab" id="errLab"></div>
      <div class="num" id="errNum">–</div>
      <div class="stars" id="stars">☆☆☆</div>
      <div class="goal" id="goal"></div>
      <div class="quip" id="quip"></div>
    </div>
  </section>

  <section class="card rec">
    <canvas id="tank" aria-hidden="true"></canvas>
    <canvas id="chart"></canvas>
    <div class="legend" id="legend"></div>
    <div class="faders" id="faders" hidden></div>
  </section>

  <section class="card controls" id="controls"></section>
  <section class="card debrief" id="debrief" hidden></section>
  <section class="card final" id="final" hidden></section>
  </div>
  <footer id="foot"></footer>
</div>

<script>
// ---------- model ----------
function sim(inp, tauAt){ let q=0; const out=[]; for(let k=0;k<inp.length;k++){ const a=Math.exp(-1/Math.max(0.05,tauAt(k))); q=q*a+(1-a)*inp[k]; out.push(q);} return out; }
function mape(p,r){ let a=0,b=0; for(let k=0;k<r.length;k++){ a+=Math.abs((p[k]??0)-r[k]); b+=Math.abs(r[k]); } return b? a/b*100 : 0; }
const N=120;
const injA=Array.from({length:N},(_,t)=> t<5?0 : t<45?1 : t<80?0.4 : 0.9);
const injB=Array.from({length:N},(_,t)=> t<10?0.5 : t<30?0 : t<65?1.1 : t<95?0.3 : 0.8);
const TAU1=6;
const CYC=7, CL=30, N2=CYC*CL;
const inj2=Array.from({length:N2},(_,t)=> (t%CL)<15?1:0);
const tauTrue=[3,4.5,6.5,4,8,5.5,9.5];
const ref2=sim(inj2,k=>tauTrue[Math.floor(k/CL)]);
let TAU0=5, BEST2=99;
for(let t=1;t<=15;t+=0.05){ const e=mape(sim(inj2,()=>t),ref2); if(e<BEST2){BEST2=e;TAU0=Math.round(t*10)/10;} }
// gas: three withdraw / refill cycles, bottom-hole pressure 200 -> 40 bar and back
const pres=Array.from({length:N+1},(_,t)=>{ const u=(t%40); return u<=25? 200-160*u/25 : 40+160*(u-25)/15; });
function drive(useM){ return Array.from({length:N},(_,k)=>{ const a=pres[k]/200,b=pres[k+1]/200; return Math.max(0, useM? (a*a-b*b) : (a-b))*25; }); }
const drvP=drive(false), drvM=drive(true);
const ref4=sim(drvM,()=>4);
let BEST4P=99; for(let t=1;t<=12;t+=0.25) for(let j=0.2;j<=3;j+=0.05){ const e=mape(sim(drvP.map(x=>x*j),()=>t),ref4); if(e<BEST4P)BEST4P=e; }
const B2=BEST2.toFixed(1), B4=BEST4P.toFixed(1);

// ---------- words ----------
const I={
zh:{
 h1:'<span>τ</span> 调音师', doc:'τ 调音师', other:'English',
 sub:'地下有个看不见的水箱。你手里只有一支红笔和几个旋钮，让红线贴上蓝线。',
 snd:on=>'声音：'+(on?'开':'关'), errLab:'平均误差', pass:g=>`过关线 ${g}%`,
 lv:['第 1 站 · 调水箱','第 2 站 · 一个 τ 走天下？','第 3 站 · 你来当 LSTM','第 4 站 · 换一把尺子','加试 · 自由画'],
 m:['岩层像一个漏水的水箱：往里注（灰色台阶），过一会儿才从另一头流出来（蓝线）。拖动 τ，也就是水箱的反应时间，让红线贴上蓝线。',
    '储气库一年一个循环，这里连着七个，你还是只有一个 τ。把误差压到 3% 以下就过关。',
    '现在每个循环一个推子 Δτ，这一轮的 τ = τ₀ + Δτ。没人告诉你正确答案，只能盯着误差推：变小就对了，变大就推回去。',
    '这回存的是气。先用压力 p 当尺子，调 τ 和 J；实在贴不上，就换一把尺子。',
    '这一站没有方程。直接在记录纸上画出产量曲线，画完按下面的按钮。'],
 m4b:'题目换了。你画的那条线是背下来的，一换就全错。只会调 τ 的模型不用重学，因为它懂水箱。',
 tau:'反应时间 τ', d:' 天', J:'井口的门 J', ruler:'量推力的尺子', p:'压力 p', mp:'拟压力 m(p)',
 giveup:'这不可能！', yourBest:'你的最好成绩', limit:'理论极限',
 tau0:v=>`τ₀ = ${v} 天（上一站能做到的最好值）`,
 race:'和机器比一比', copy:'抄机器的答案（只给一颗星）', zero:'推子归零', you:'你', mach:'机器',
 steps:(n,e)=>`<b>${n}</b> 步，误差 <b>${e}</b>`, tries:(n,e)=>`试了 <b>${n}</b> 次，误差 <b>${e}</b>`, notYet:'还没上场',
 vCopied:'抄来的不算赢。', vWin:'你赢了机器，或者说，你就是机器。', vLose:'机器赢了。不过它用的办法和你一模一样。',
 h4lock:'先用压力 p 调调看', h4open:e=>`用 p 最好只到过 ${e}，怎么调都卡住。换把尺子试试 →`,
 swap:'换一套注入方案', clear:'擦掉重画', hand:'你的手绘', phys:'只调 τ 的模型', drawHint:'按住，从左到右画出你的预测', dragMe:'← 拖我',
 tod:'过关了！这是怎么回事？ ↓', todWait:'过关后解锁说明', next:'下一站 →', results:'看成绩 →',
 lRef:'参照（真实的井）', lPen:'你的红笔', lInj:'注入', lPush:'推力（压力下降换来的）', lMach:'机器的笔', lFad:'推子在图下方，对着各自的循环',
 scrub:'点图上任意时刻，水箱显示当时的样子', lDrag:'在图上按住某个循环上下拖，或点 ＋ −', replay:'回放一遍', cyc:'循环 ', time:'时间 →', loss:'误差 · 每试一次',
 tank:'看不见的水箱', tankS:'水箱', tin:'注入 ', tpush:'推力 ', tyou:'你的流出 ', treal:'真实流出 ',
 q:{wait:'等你下笔',stuck:'好像……卡住了？',more:'再拧拧看',cant:'顾了前面，顾不了后面',memo:'背答案的下场',nice:'画得真像',ask:'画得像不像？',perfect:'严丝合缝',ok:'贴上了！',close:'快了，再细一点',right:'方向对了',far:'差得远呢'},

// ---------- state ----------
const TOUCH=matchMedia('(pointer: coarse)').matches;
const LV=[{goal:5,s:[2,5,10]},{goal:3,s:[0,0,0]},{goal:5,s:[1,3,6]},{goal:3,s:[1,3,6]},{goal:null,s:TOUCH?[10,18,100]:[5,10,100]}];
const FRESH=()=>({lv:0, unlocked:0, stars:[0,0,0,0,0], tau1:1.5, tau2:2, gaveUp:false, d:[0,0,0,0,0,0,0], tau4:2, j4:0.5, useM:false, drawn:null, swapped:false, drawErr:null, done:false,
  best:[null,null,null,null,null], moves:0, md:null, mTries:0, mErr:null, mDone:false, copied:false, bestP:null, n4:0, unlock4:false});
let S={...FRESH(), snd:false, touched:false, started:false, seen4:false, lang:(navigator.language||'zh').toLowerCase().startsWith('zh')?'zh':'en'};
const T=()=>I[S.lang];
const $=id=>document.getElementById(id);
const cv=$('chart'), cx=cv.getContext('2d');
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur={ref:[],pred:[],inj:[],err:0,ymax:1.25}, aiTimer=null, lossHist=[], PH=0.35, sweepId=null;

function compute(){
  const L=S.lv;
  if(L===0) cur={ref:sim(injA,()=>TAU1), pred:sim(injA,()=>S.tau1), inj:injA, ymax:1.25};
  if(L===1) cur={ref:ref2, pred:sim(inj2,()=>S.tau2), inj:inj2, ymax:1.25, cyc:true};
  if(L===2) cur={ref:ref2, pred:sim(inj2,k=>TAU0+S.d[Math.floor(k/CL)]), inj:inj2, ymax:1.25, cyc:true, extra:S.md? sim(inj2,k=>TAU0+S.md[Math.floor(k/CL)]):null};
  if(L===3){ const d=S.useM?drvM:drvP; cur={ref:ref4, pred:sim(d.map(x=>x*S.j4),()=>S.tau4), inj:d, ymax:2.1}; }
  if(L===4){ const inj=S.swapped?injB:injA;
    cur={ref:sim(inj,()=>TAU1), pred:S.drawn? S.drawn.map(v=>v??0):[], inj, ymax:1.4, extra:S.swapped? sim(inj,()=>S.tau1Final??6.3):null, noPred:!S.drawn}; }
  cur.err = cur.noPred? null : mape(cur.pred,cur.ref);
}
function starsFor(L,e){ const s=LV[L].s; return e<=s[0]?3 : e<=s[1]?2 : e<=s[2]?1 : 0; }
const passed=L=>S.stars[L]>0;
function judge(){
  const L=S.lv, e=cur.err, before=S.stars[L];
  if(L===0||L===2||L===3){ let st=e<=LV[L].goal? Math.max(1,starsFor(L,e)) : 0; if(L===2&&S.copied) st=Math.min(st,1); if(st>S.stars[L]) S.stars[L]=st; }
  if(L===1 && S.gaveUp) S.stars[1]=Math.max(S.stars[1], e<=BEST2+0.3?3 : e<=BEST2+1.5?2 : 1);
  if(L===4 && S.swapped && S.drawErr!=null) S.stars[4]=Math.max(S.stars[4], Math.max(1,starsFor(4,S.drawErr)));
  if(passed(L) && S.unlocked<Math.min(L+1,4)) S.unlocked=L+1;
  if(!before && S.stars[L]) chord();
}
const fmtD=v=>(v>0?'+':'')+v.toFixed(1);
const fmtE=e=>e==null?'–':(e<10?e.toFixed(1):e.toFixed(0))+'%';

// ---------- chart ----------
function draw(){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight; if(!W) return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  cx.setTransform(dpr,0,0,dpr,0,0);
  const small=W<520, pl=36, pr=12, pt=14, pb=24, pw=W-pl-pr, ph=H-pt-pb, n=cur.ref.length;
  const X=k=>pl+pw*k/(n-1), Y=v=>pt+ph*(1-Math.min(v,cur.ymax)/cur.ymax);
  cx.fillStyle='#f6faf2'; cx.fillRect(0,0,W,H); cx.lineWidth=1;
  const nx=small?20:40;
  for(let i=0;i<=nx;i++){ const x=pl+pw*i/nx; cx.strokeStyle=i%5?'#dbe8dc':'#b3cfb9'; cx.beginPath(); cx.moveTo(x,pt); cx.lineTo(x,pt+ph); cx.stroke(); }
  for(let i=0;i<=10;i++){ const y=pt+ph*i/10; cx.strokeStyle=i%5?'#dbe8dc':'#b3cfb9'; cx.beginPath(); cx.moveTo(pl,y); cx.lineTo(pl+pw,y); cx.stroke(); }
  cx.font='11px "IBM Plex Mono",monospace'; cx.fillStyle='#56655f'; cx.textAlign='right'; cx.textBaseline='middle';
  (cur.ymax>1.6?[0,1,2]:[0,0.5,1]).forEach(v=>cx.fillText(v.toFixed(1),pl-6,Y(v)));
  cx.textAlign='center'; cx.textBaseline='top';
  if(cur.cyc){ for(let c=0;c<CYC;c++){ cx.fillText((small?'':T().cyc)+(c+1), X(c*CL+CL/2), pt+ph+6);
      if(c){ cx.strokeStyle='#1c2947'; cx.setLineDash([3,4]); cx.beginPath(); cx.moveTo(X(c*CL),pt); cx.lineTo(X(c*CL),pt+ph); cx.stroke(); cx.setLineDash([]);} } }
  else cx.fillText(T().time, pl+pw/2, pt+ph+6);
  if(S.lv===2 && dragC>=0){ cx.fillStyle='rgba(169,120,31,.16)'; cx.fillRect(X(dragC*CL),pt,X((dragC+1)*CL-1)-X(dragC*CL)+pw/(n-1),ph); }
  cx.fillStyle='rgba(28,41,71,.10)'; cx.beginPath(); cx.moveTo(X(0),Y(0));
  for(let k=0;k<n;k++){ cx.lineTo(X(k),Y(cur.inj[k])); if(k<n-1) cx.lineTo(X(k+1),Y(cur.inj[k])); }
  cx.lineTo(X(n-1),Y(0)); cx.closePath(); cx.fill();
  const line=(arr,col,w,dash)=>{ cx.strokeStyle=col; cx.lineWidth=w; cx.lineJoin='round'; cx.setLineDash(dash||[]); cx.beginPath(); let on=false;
    for(let k=0;k<arr.length;k++){ const v=arr[k]; if(v==null){on=false;continue;} on? cx.lineTo(X(k),Y(v)) : cx.moveTo(X(k),Y(v)); on=true; } cx.stroke(); cx.setLineDash([]); };
  line(cur.ref,'#1c2947',small?3:4);
  if(cur.extra) line(cur.extra,'#a9781f',2.5,[7,4]);
  if(S.lv===4 && S.drawn) line(S.drawn,'#d3382c',2.5); else if(!cur.noPred) line(cur.pred,'#d3382c',2.5);
  if(S.lv===4 && !S.drawn){ cx.fillStyle='#d3382c'; cx.font='500 '+(small?13:15)+'px "Noto Sans SC",sans-serif'; cx.textAlign='center'; cx.fillText(T().drawHint, pl+pw/2, pt+10); }
  if(S.lv===2 && lossHist.length>1){
    const bw=small?92:120, bh=44, bx=pl+pw-bw-8, by=pt+6, mx=Math.max(...lossHist);
    cx.fillStyle='rgba(251,252,247,.92)'; cx.fillRect(bx,by,bw,bh); cx.strokeStyle='#1c2947'; cx.lineWidth=1; cx.strokeRect(bx,by,bw,bh);
    cx.strokeStyle='#a9781f'; cx.lineWidth=2; cx.beginPath(); lossHist.forEach((v,i)=>{ const x=bx+4+(bw-8)*i/(lossHist.length-1), y=by+bh-4-(bh-16)*v/mx; i?cx.lineTo(x,y):cx.moveTo(x,y); }); cx.stroke();
    cx.fillStyle='#56655f'; cx.font='10px "IBM Plex Mono","Noto Sans SC",monospace'; cx.textAlign='left'; cx.textBaseline='top'; cx.fillText(T().loss,bx+4,by+2); }
  { const k=Math.min(n-1,Math.floor(PH*n)); cx.strokeStyle='rgba(169,120,31,.75)'; cx.lineWidth=1.5; cx.fillStyle='#a9781f';
    cx.beginPath(); cx.moveTo(X(k)-5,pt-1); cx.lineTo(X(k)+5,pt-1); cx.lineTo(X(k),pt+7); cx.closePath(); cx.fill();
    cx.beginPath(); cx.moveTo(X(k),pt); cx.lineTo(X(k),pt+ph); cx.stroke(); }
  if(small && cur.err!=null && S.lv!==2){ // phones: keep the score next to the curve
    const s=fmtE(cur.err); cx.font='600 18px "IBM Plex Mono",monospace'; const w=cx.measureText(s).width+12;
    cx.fillStyle='rgba(251,252,247,.92)'; cx.fillRect(pl+pw-w-4,pt+4,w,26); cx.fillStyle='#d3382c'; cx.textAlign='right'; cx.textBaseline='middle'; cx.fillText(s,pl+pw-10,pt+18); }
  cv._map={pl,pw,pt,ph,n};
}

// ---------- the tank you cannot see ----------
const tk=$('tank'), tx=tk.getContext('2d');
function drawTank(){
  const dpr=window.devicePixelRatio||1, W=tk.clientWidth, H=tk.clientHeight; if(!W) return;
  if(tk.width!==Math.round(W*dpr)||tk.height!==Math.round(H*dpr)){ tk.width=Math.round(W*dpr); tk.height=Math.round(H*dpr); }
  tx.setTransform(dpr,0,0,dpr,0,0); tx.clearRect(0,0,W,H);
  const n=cur.ref.length, k=Math.min(n-1,Math.floor(PH*n)), ym=cur.ymax, w=T();
  const inj=cur.inj[k]||0, real=cur.ref[k]||0, you=(S.lv===4? (S.drawn? (S.drawn[k]??0):0) : cur.pred[k])||0;

    if(step<0.1||best<0.4){ aiTimer=null; S.mDone=true; render(); return; }

  }; tick();
}

// ---------- sound: the closer the fit, the truer the note ----------
let AC=null, lastTone=0;
function tone(f,d=0.12,v=0.06,t0=0){ if(!S.snd||!AC) return; try{ const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=f; const t=AC.currentTime+t0;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.03);}catch(e){} }
function errTone(e){ if(e==null) return; const now=performance.now(); if(now-lastTone<70) return; lastTone=now; tone(440*Math.pow(2,-Math.min(e,36)/36)); }
function chord(){ [440,554.37,659.25,880].forEach((f,i)=>tone(f,0.6,0.05,i*0.08)); }
$('snd').onclick=()=>{ S.snd=!S.snd; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); AC.resume&&AC.resume(); }catch(e){ S.snd=false; } chrome(); if(S.snd) chord(); };
$('lang').onclick=()=>{ S.lang=S.lang==='zh'?'en':'zh'; render(); if(S.done && S.started) finale(true); };

// ---------- one small picture per debrief ----------

  }

    b+=`<line x1="12" x2="232" y1="${yl}" y2="${yl}" stroke="#d3382c" stroke-width="2.5" stroke-dasharray="6 4">${(A&&L===1)?`<animate attributeName="y1" values="${yl};${yl+24};${yl-40};${yl}" dur="3.2s" repeatCount="2"/><animate attributeName="y2" values="${yl};${yl+24};${yl-40};${yl}" dur="3.2s" repeatCount="2"/>`:''}</line>`;
    b+=tx(12,14,w.gNeed,'#1c2947',12,'start')+tx(12,30,L===1?w.gFix:'τ₀','#d3382c',12,'start',700);
    if(L===2){ b+=tx(60,30,'+ Δτ','#a9781f',12,'start',700);
      tauTrue.forEach((t,i)=>{ const x=28+i*30, yt=y0-t*sc, up=yt<yl, tip=yt+(up?5:-5);
        b+=`<g opacity="${A?0:1}"><line x1="${x}" x2="${x}" y1="${yl}" y2="${tip}" stroke="#a9781f" stroke-width="2.5"/><path d="M${x-4.5} ${tip}h9l-4.5 ${up?-6:6}z" fill="#a9781f"/>${A?`<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="${0.3+i*0.35}s" fill="freeze"/>`:''}</g>`; }); }

    b+=tx(20,24,w.gEq,'#1c2947',12,'start',700)+rule(52,false,'#1c2947')+tx(20,98,w.gUn,'#d3382c',12,'start',700)+rule(126,true,'#d3382c')+tx(20,156,w.gLo,'#56655f',11,'start')+tx(240,156,w.gHi,'#56655f',11,'end');

     +tx(150,90,'✓','#1c2947',26,'middle',700)+tx(215,90,'✗','#d3382c',26,'middle',700)+tx(150,140,'✓','#1c2947',26,'middle',700)+tx(215,140,'✓','#1c2947',26,'middle',700);

  return `<svg viewBox="0 0 260 170" role="img" aria-label="${w.db[L][1]}">${b}</svg>`;

// ---------- finale ----------
function scoreCard(tot,rank){
  const w=T(), c=document.createElement('canvas'); c.width=1080; c.height=1350; const g=c.getContext('2d');
  g.fillStyle='#edf3e8'; g.fillRect(0,0,1080,1350); g.strokeStyle='#bcd5c1'; g.lineWidth=2;
  for(let x=0;x<=1080;x+=54){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,1350); g.stroke(); } for(let y=0;y<=1350;y+=54){ g.beginPath(); g.moveTo(0,y); g.lineTo(1080,y); g.stroke(); }
  g.fillStyle='#fbfcf7'; g.fillRect(70,70,940,1210); g.strokeStyle='#1c2947'; g.lineWidth=5; g.strokeRect(70,70,940,1210);
  const D='"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif', B='"Noto Sans SC",sans-serif', M='"IBM Plex Mono",monospace';
  g.textAlign='left'; g.textBaseline='alphabetic'; g.font='90px '+D;
  if(S.lang==='zh'){ g.fillStyle='#d3382c'; g.fillText('τ',130,210); g.fillStyle='#1c2947'; g.fillText('调音师',200,210); }
  else { g.fillStyle='#1c2947'; g.fillText('The',130,210); const a=g.measureText('The ').width; g.fillStyle='#d3382c'; g.fillText('τ',130+a,210); g.fillStyle='#1c2947'; g.fillText('Tuner',130+a+g.measureText('τ ').width,210); }
  g.font='500 34px '+B; g.fillStyle='#56655f'; g.fillText(w.myRank,130,330);
  let fs=150; g.font=fs+'px '+D; while(g.measureText(rank).width>820 && fs>60){ fs-=6; g.font=fs+'px '+D; }
  g.fillStyle='#1c2947'; g.fillText(rank,125,490);
  g.font='56px '+B; g.fillStyle='#a9781f'; g.fillText('★'.repeat(tot)+'☆'.repeat(15-tot),125,590);
  const sw=S.drawn? mape(S.drawn.map(v=>v??0),sim(injB,()=>TAU1)) : null;
  const vals=[fmtE(S.best[0]), w.lim+B2+'%', fmtE(S.best[2])+(S.moves?' · '+S.moves+w.mv:''), fmtE(S.best[3]), fmtE(S.drawErr)+w.aft+fmtE(sw)];
  w.rows.forEach((r,i)=>{ const y=720+i*92; g.font='500 '+(S.lang==='zh'?38:32)+'px '+B; g.fillStyle='#1c2947'; g.textAlign='left'; g.fillText(r,130,y);
    g.font='600 '+(i===4?30:38)+'px '+M+','+B; g.fillStyle='#d3382c'; g.textAlign='right'; g.fillText(vals[i],950,y); g.strokeStyle='#c9d6c9'; g.lineWidth=2; g.beginPath(); g.moveTo(130,y+26); g.lineTo(950,y+26); g.stroke(); });
  g.textAlign='left'; g.fillStyle='#1c2947'; let ps=40; g.font='700 '+ps+'px '+B; const words=w.punch;
  if(g.measureText(words).width>820){ const mid=S.lang==='zh'? words.indexOf('，')+1 : words.indexOf('. ')+2; g.font='700 31px '+B; g.fillText(words.slice(0,mid).trim(),130,1170); g.fillText(words.slice(mid).trim(),130,1216); }
  else g.fillText(words,130,1205);
  g.font='26px '+B; g.fillStyle='#56655f'; g.fillText(w.cardFoot,130,1256);
  return c.toDataURL('image/png');
}

function finale(keep){
  S.done=true; const w=T(), tot=S.stars.reduce((a,b)=>a+b,0), rank=w.ranks[tot>=12?2:tot>=7?1:0], F=$('final'); F.hidden=false;
  F.innerHTML=`<div class="intro end"><div class="l"><small class="eye">${w.eEye}</small><h2 class="sm">${rank}</h2><div class="big">${'★'.repeat(tot)}${'☆'.repeat(15-tot)}</div><p>${w.eStory}</p><p class="mis">${w.punch}</p></div><div>${shaft(true)}</div></div>
   <div class="top"><img alt="${rank}" src="${scoreCard(tot,rank)}"><small>${w.save}</small><p><button class="btn" id="again">${w.again}</button></p></div>`;
  $('again').onclick=()=>{ S={...S,...FRESH(),started:false,seen4:false}; lossHist=[]; render(); window.scrollTo({top:0}); };

}
